services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_DB=nexus_db
      - POSTGRES_USER=nexus_user
      - POSTGRES_PASSWORD=nexus_pass
      - TZ=America/Lima
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    environment:
      - TZ=America/Lima
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: nexus_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=America/Lima
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: nexus_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=America/Lima
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: