<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script src="https://cdn.tailwindcss.com"></script>

{% load static %}
<div id="notification-settings" class="max-w-2xl mx-auto mt-8 p-6 bg-white border border-gray-200 rounded-xl shadow-md">
    
    <div class="flex items-center space-x-3 mb-6 border-b pb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <h3 class="text-xl font-bold text-gray-800">Preferencias de Notificación</h3>
    </div>

    {% if message %}
        <div id="success-alert" class="flex items-center p-4 mb-6 text-green-800 rounded-lg bg-green-50 border border-green-200 transition-opacity duration-500">
            <svg class="flex-shrink-0 w-4 h-4 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
            </svg>
            <span class="text-sm font-medium">{{ message }}</span>
        </div>
    {% endif %}

    <form hx-post="{% url 'org-settings' org_slug %}" 
          hx-target="#notification-settings" 
          hx-swap="outerHTML" 
          class="space-y-6">
        
        {% csrf_token %}

        <div class="p-4 bg-blue-50 border-l-4 border-blue-400 rounded">
            <label class="block text-sm font-semibold text-blue-900 mb-2">
                Canal Principal (Obligatorio)
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 16">
                        <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                        <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                    </svg>
                </div>
                <input type="email" name="admin_email" value="{{ org.admin_email }}" 
                       class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" 
                       placeholder="admin@tuempresa.com" required>
            </div>
            <p class="mt-1 text-xs text-blue-700 italic">* Se usará para enviar los reportes generados automáticamente.</p>
        </div>

        <div class="space-y-4 pt-2">
            <h4 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Canales de Refuerzo</h4>
            
            <label class="relative flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition">
                <input type="checkbox" name="telegram_enabled" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500" 
                       {% if org.telegram_enabled %}checked{% endif %}>
                <span class="ml-3 text-sm font-medium text-gray-900">Activar Notificaciones vía Telegram</span>
                <span class="ml-auto text-xs font-semibold text-gray-400">Bot @Nexus_OMS</span>
            </label>

            <label class="relative flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition">
                <input type="checkbox" name="whatsapp_enabled" class="w-4 h-4 text-green-600 bg-gray-100 border-gray-300 rounded focus:ring-green-500" 
                       {% if org.whatsapp_enabled %}checked{% endif %}>
                <span class="ml-3 text-sm font-medium text-gray-900">Activar Notificaciones vía WhatsApp</span>
                <span class="ml-auto text-xs font-semibold text-gray-400">API Oficial</span>
            </label>
        </div>

        <div class="flex justify-end pt-4 border-t">
            <button type="submit" 
                    class="flex items-center justify-center px-6 py-2.5 text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 rounded-lg text-center transition">
                <span class="htmx-indicator animate-spin mr-2">⏳</span>
                Guardar Configuración
            </button>
        </div>
    </form>
</div>
