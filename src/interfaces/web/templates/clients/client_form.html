{% extends "layouts/base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <div class="flex items-center gap-3">
        <a href="{{ cancel_url }}"
           class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
        </a>
        <h1 class="text-2xl font-bold text-gray-900">{{ form_title }}</h1>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 rounded-xl p-4 flex gap-3 items-start">
        <svg class="w-4 h-4 text-red-500 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <p class="text-sm text-red-700 font-medium">{{ error }}</p>
    </div>
    {% endif %}

    {% if messages %}
    {% for msg in messages %}
    <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-sm text-green-700 font-medium">{{ msg }}</div>
    {% endfor %}
    {% endif %}

    <div class="card-tenant">
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-5">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">
                            Tipo de Documento <span class="text-red-500">*</span>
                        </label>
                        <select name="document_type"
                                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all bg-white">
                            {% for code, label in doc_types %}
                            <option value="{{ code }}" {% if current.document_type == code %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">
                            Número de Documento <span class="text-red-500">*</span>
                        </label>
                        <input type="text" name="document_number"
                               value="{{ current.document_number }}"
                               placeholder="Ej: 12345678"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-mono focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">
                        Nombre / Razón Social <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name"
                           value="{{ current.name }}"
                           placeholder="Ej: JUAN PÉREZ GARCÍA"
                           class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">Teléfono</label>
                        <input type="text" name="phone"
                               value="{{ current.phone }}"
                               placeholder="Ej: 987654321"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">Correo Electrónico</label>
                        <input type="email" name="email"
                               value="{{ current.email }}"
                               placeholder="cliente@ejemplo.com"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-gray-400 mb-1.5">Dirección</label>
                    <textarea name="address" rows="2"
                              placeholder="Av. Lima 123, Miraflores..."
                              class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm resize-none focus:ring-2 focus:ring-tenant-primary/30 focus:border-tenant-primary transition-all">{{ current.address }}</textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="btn-tenant py-3 flex-1 justify-center text-sm font-black uppercase tracking-wider">
                        {{ submit_label }}
                    </button>
                    <a href="{{ cancel_url }}"
                       class="px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-all text-sm flex items-center">
                        Cancelar
                    </a>
                </div>

            </div>
        </form>
    </div>

</div>
{% endblock %}
