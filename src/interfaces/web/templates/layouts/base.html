<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus OMS{% endblock %} - {{ tenant.name }}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tenant: {
                            primary: '{{ tenant.primary_color|default:"#000000" }}',
                            secondary: '{{ tenant.secondary_color|default:"#FFFFFF" }}',
                        }
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .btn-tenant {
                @apply bg-tenant-secondary text-tenant-primary px-5 py-2 rounded-lg shadow-md flex items-center gap-2 hover:opacity-90 transition-all font-semibold;
            }
            .card-tenant {
                @apply bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-tenant-primary;
            }
            .nav-link {
                @apply flex items-center gap-2 text-sm font-medium hover:text-tenant-secondary/80 transition-colors;
            }
        }
    </style>
</head>
<body class="bg-gray-50/50 font-sans antialiased" hx-boost="true">
    
    {% include "layouts/partials/navbar.html" %}
    
    <div class="flex">
        <aside class="w-64 bg-white border-r border-gray-200 h-[calc(100vh-5rem)] sticky top-20 hidden lg:block overflow-y-auto">
            {% include "layouts/partials/sidebar.html" %}
        </aside>

        <main class="flex-1 py-8 px-4 lg:px-8">
            <div class="max-w-full mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <div id="modals-here" class="modal-container"></div>

    <script>
        // CSRF para HTMX
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        // Cerrar modal al terminar una acción exitosa (opcional)
        document.body.addEventListener('htmx:afterSwap', (e) => {
            if (e.detail.target.id === "modals-here" && e.detail.xhr.status === 204) {
                document.getElementById("modals-here").innerHTML = "";
            }
        });
    </script>
</body>
</html>
