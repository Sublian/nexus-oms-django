<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus OMS{% endblock %} - {{ tenant.name }}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <style>
        :root {
            /* Inyectamos tus nuevos campos de base de datos directamente al CSS */
            --tenant-primary: {{ tenant.primary_color|default:"#000000" }};
            --tenant-secondary: {{ tenant.secondary_color|default:"#FFFFFF" }};
        }

        /* Clases utilitarias personalizadas */
        .bg-tenant-primary { background-color: var(--tenant-primary); }
        .text-tenant-primary { color: var(--tenant-primary); }
        .border-tenant-primary { border-color: var(--tenant-primary); }
        
        .btn-tenant {
            background-color: var(--tenant-primary);
            color: var(--tenant-secondary);
            transition: opacity 0.2s;
        }
        .btn-tenant:hover { opacity: 0.9; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased" hx-boost="true">
    
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    {% if tenant.logo_image %}
                        <img src="{{ tenant.logo_image.url }}" alt="Logo" class="h-8 w-auto mr-3">
                    {% endif %}
                    <span class="text-xl font-bold border-l-4 border-tenant-primary pl-3">
                        {{ tenant.name|upper }}
                    </span>
                </div>
                
                <div class="hidden md:block">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800 border-tenant-primary border">
                        <span class="w-2 h-2 mr-2 rounded-full bg-tenant-primary"></span>
                        Modo Operativo
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-10">
        <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // Token CSRF para todas las peticiones HTMX
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
