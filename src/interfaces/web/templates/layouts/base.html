<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus OMS{% endblock %} - {{ tenant.name }}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tenant: {
                            primary: '{{ tenant.primary_color|default:"#000000" }}',
                            secondary: '{{ tenant.secondary_color|default:"#FFFFFF" }}',
                        }
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer components {
            .btn-tenant {
                @apply bg-tenant-secondary text-tenant-primary px-5 py-2 rounded-lg shadow-md flex items-center gap-2 hover:opacity-90 transition-all font-semibold;
            }
            .card-tenant {
                @apply bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-tenant-primary;
            }
            .nav-link {
                @apply flex items-center gap-2 text-sm font-medium hover:text-tenant-secondary/80 transition-colors;
            }
        }
    </style>
</head>
<body class="bg-gray-50/50 font-sans antialiased" hx-boost="true">
    
    <nav class="bg-tenant-primary text-tenant-secondary shadow-lg border-b border-tenant-secondary/10">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                
                <a href="{% url 'web:dashboard_home' tenant.slug %}" class="flex items-center gap-4 hover:opacity-90 transition-opacity">
                    {% if tenant.logo_image %}
                        <img src="{{ tenant.logo_image.url }}" alt="Logo {{ tenant.name }}" class="h-10 w-auto bg-white p-1 rounded-md">
                    {% endif %}
                    <div class="flex items-center gap-2">
                        <span class="text-3xl font-extrabold tracking-tighter">{{ tenant.name|upper }}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-tenant-secondary/10 border border-tenant-secondary/20 font-medium">
                            OMS
                        </span>
                    </div>
                </a>
                
                <div class="flex items-center gap-5">
                    <button class="nav-link">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        Alertas
                    </button>
                    
                    <div class="h-8 w-px bg-tenant-secondary/20"></div>

                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.away="open = false" class="flex items-center gap-3 hover:opacity-80 transition-opacity focus:outline-none">
                            <div class="w-10 h-10 rounded-full bg-tenant-secondary text-tenant-primary flex items-center justify-center font-bold text-lg border-2 border-tenant-secondary/30 shadow-inner">
                                {{ user.first_name|default:"O"|first }}
                            </div>
                            <span class="font-medium text-sm hidden md:block">{{ user.get_full_name|default:"Operador Nexus" }}</span>
                            <svg class="w-4 h-4 transition-transform" :class="{'rotate-180': open}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                        </button>

                        <div x-show="open" 
                             x-transition:enter="transition ease-out duration-100"
                             x-transition:enter-start="transform opacity-0 scale-95"
                             x-transition:enter-end="transform opacity-100 scale-100"
                             class="absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50 overflow-hidden"
                             style="display: none;">
                            
                            <div class="px-4 py-2 border-b border-gray-50 mb-1">
                                <p class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Mi Cuenta</p>
                            </div>

                            <a href="{% url 'web:org-settings' tenant.slug %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-tenant-primary hover:text-tenant-secondary transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                Configuración
                            </a>

                            <hr class="my-1 border-gray-50">

                            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                Cerrar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-12">
        <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        // Token CSRF para HTMX
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
