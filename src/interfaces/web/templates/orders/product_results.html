<div class="absolute z-50 w-full bg-white border border-gray-200 shadow-xl rounded-b-lg overflow-hidden">
    {% for product in products %}
    <div class="p-3 hover:bg-gray-50 cursor-pointer border-b last:border-none flex justify-between items-center"
         hx-post="{% url 'web:add-to-cart' tenant.slug product.id %}"
         hx-target="#order-items"
         hx-swap="beforeend">
        <div>
            <p class="text-sm font-bold text-gray-800">{{ product.name }}</p>
            <p class="text-[10px] text-gray-500 uppercase tracking-tighter">SKU: {{ product.sku }}</p>
        </div>
        <div class="text-right">
            <span class="text-xs font-mono font-bold text-tenant-primary">S/ {{ product.price }}</span>
            <p class="text-[10px] text-green-600">Stock: {{ product.stock }}</p>
        </div>
    </div>
    {% empty %}
    <div class="p-4 text-center text-sm text-gray-500">No se encontraron productos.</div>
    {% endfor %}
</div>
