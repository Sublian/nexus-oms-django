<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-gray-100 animate-in fade-in zoom-in duration-200">
    <div class="p-6">
        <div class="flex items-start gap-4">
            <span class="shrink-0 w-10 h-10 flex items-center justify-center rounded-full bg-sky-100 text-sky-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </span>
            <div>
                <h3 class="font-extrabold text-gray-900">Pago pendiente de confirmación</h3>
                <p class="text-sm text-gray-500 mt-1">
                    Orden <span class="font-mono font-bold">#{{ order.id }}</span> ·
                    Pago con <strong>{{ payment.get_method_display }}</strong> por
                    <strong>S/ {{ payment.amount }}</strong>.
                </p>
                <p class="text-xs text-gray-400 mt-2">
                    El pedido pasará a <strong>Pagado</strong> en cuanto la pasarela confirme el cobro
                    (botón "Confirmar pago" o sincronización automática cada 60s).
                </p>
            </div>
        </div>
        <button onclick="document.getElementById('modals-here').innerHTML=''"
                class="mt-5 w-full px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-all text-sm">
            Cerrar
        </button>
    </div>
</div>
