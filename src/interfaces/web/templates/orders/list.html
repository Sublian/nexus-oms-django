<td>
    {% if order.pdf_report %}
        <a href="{{ order.pdf_report.url }}" target="_blank" class="text-blue-600 hover:underline">
            📄 Ver PDF
        </a>
    {% else %}
        <button 
            hx-post="{% url 'generate_order_pdf' order.id %}" 
            hx-swap="outerHTML"
            class="bg-indigo-500 text-white px-3 py-1 rounded text-xs">
            Generar PDF
        </button>
    {% endif %}
</td>
