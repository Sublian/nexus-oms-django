<div id="company-settings"> 
    <h3 class="text-xl font-bold text-gray-800 mb-6 border-b pb-4">Información de la Empresa</h3>
    
    {% if message %}
        <div class="p-3 mb-4 bg-green-100 text-green-700 rounded-lg border border-green-200">
            {{ message }}
        </div>
    {% endif %}

    <form hx-post="{% url 'web:org_settings_company' tenant.slug %}" 
          hx-target="#company-settings" 
          hx-swap="outerHTML" 
          class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700">Nombre de la Organización</label>
                <input type="text" name="name" value="{{ tenant.name }}" 
                       class="w-full border-gray-300 rounded-lg p-2.5 focus:ring-tenant-primary focus:border-tenant-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">RUC / ID Fiscal</label>
                <input type="text" name="ruc" value="{{ tenant.ruc }}" 
                       class="w-full border-gray-300 rounded-lg p-2.5">
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700">Dirección Legal</label>
                <textarea name="address" rows="3" 
                          class="w-full border-gray-300 rounded-lg p-2.5">{{ tenant.address }}</textarea>
            </div>
        </div>
        <div class="flex justify-end pt-4">
            <button type="submit" class="btn-tenant !bg-tenant-primary !text-tenant-secondary">
                Actualizar Información
            </button>
        </div>
    </form>
</div>
