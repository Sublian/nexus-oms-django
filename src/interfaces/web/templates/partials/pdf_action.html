<div id="pdf-action-container-{{ order.id }}" class="flex-1"
     {% if pending %}
     hx-get="{% url 'web:order_pdf_status' org_slug=order.organization.slug order_id=order.id %}?attempt={{ next_attempt }}"
     hx-trigger="load delay:2s"
     hx-target="this"
     hx-swap="outerHTML"
     {% endif %}>
    {% if order.pdf_report %}
        <a href="{{ order.pdf_report.url }}" target="_blank"
           class="w-full py-4 bg-green-600 text-white rounded-xl font-black shadow-lg shadow-green-600/30 hover:translate-y-[-1px] transition-all flex items-center justify-center gap-2 uppercase text-xs tracking-[0.1em]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Descargar Comprobante PDF
        </a>
    {% elif pending %}
        <div class="w-full py-4 bg-gray-900 text-tenant-secondary rounded-xl font-black flex items-center justify-center gap-3 uppercase text-xs tracking-[0.1em] animate-pulse">
            <svg class="animate-spin h-4 w-4 text-tenant-secondary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Sincronizando Archivo...</span>
        </div>
        <p class="text-[9px] text-center text-gray-400 mt-2 font-bold tracking-tighter uppercase opacity-60">
            La tarea se ha delegado al worker de reporting
        </p>
    {% else %}
        <button
            hx-post="{% url 'web:generate_order_pdf' org_slug=order.organization.slug order_id=order.id %}"
            hx-target="#pdf-action-container-{{ order.id }}"
            hx-swap="outerHTML"
            class="w-full py-4 bg-tenant-primary text-tenant-secondary rounded-xl font-black shadow-lg shadow-tenant-primary/30 hover:translate-y-[-1px] active:translate-y-[0px] transition-all flex items-center justify-center gap-2 uppercase text-xs tracking-[0.1em]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Generar PDF Oficial
        </button>
    {% endif %}
</div>
