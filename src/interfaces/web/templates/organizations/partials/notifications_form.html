<div id="notification-settings">
    <div class="flex items-center space-x-3 mb-6 border-b pb-4">
        <h3 class="text-xl font-bold text-gray-800">Preferencias de Notificación</h3>
    </div>

    {% if message %}
        <div class="p-4 mb-6 text-green-800 rounded-lg bg-green-50 border border-green-200">
            {{ message }}
        </div>
    {% endif %}

    <form hx-post="{% url 'web:org_settings_notifications' tenant.slug %}" 
          hx-target="#notification-settings" 
          hx-swap="outerHTML" 
          class="space-y-6">
        
        {% csrf_token %}

        <div class="p-4 bg-gray-50 border-l-4 border-tenant-primary rounded">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Canal Principal</label>
            <input type="email" name="admin_email" value="{{ tenant.admin_email }}" 
                   class="border border-gray-300 text-sm rounded-lg focus:ring-tenant-primary focus:border-tenant-primary block w-full p-2.5">
            <p class="mt-1 text-xs text-tenant-primary/70 italic">* Se usará para enviar los reportes generados automáticamente.</p>
        </div>

        <div class="space-y-4 pt-2">
            <h4 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Canales de Refuerzo</h4>
            
            <label class="relative flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition">
                <input type="checkbox" name="telegram_enabled" class="w-4 h-4 text-tenant-primary bg-gray-100 border-gray-300 rounded" 
                       {% if tenant.telegram_enabled %}checked{% endif %}>
                <span class="ml-3 text-sm font-medium text-gray-900">Activar Telegram</span>
                <span class="ml-auto text-xs font-semibold text-gray-400">@Nexus_OMS</span>
            </label>

            <label class="relative flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition">
                <input type="checkbox" name="whatsapp_enabled" class="w-4 h-4 text-green-600 bg-gray-100 border-gray-300 rounded" 
                       {% if tenant.whatsapp_enabled %}checked{% endif %}>
                <span class="ml-3 text-sm font-medium text-gray-900">Activar WhatsApp</span>
                <span class="ml-auto text-xs font-semibold text-gray-400">API Oficial</span>
            </label>
        </div>

        <div class="flex justify-end pt-4 border-t">
            <button type="submit" class="btn-tenant !bg-tenant-primary !text-tenant-secondary">
                Guardar Notificaciones
            </button>
        </div>
    </form>
</div>
